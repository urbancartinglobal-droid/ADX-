name: ADXmug Intelligence Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ADXmug Signal Engine v5
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          HEADERS={'User-Agent':'ADXmug/5.0'}
          BASE='https://news.google.com/rss/search?q='
          PARAMS='&hl=en-IN&gl=IN&ceid=IN:en'

          # v5 principle:
          # freshness -> real sector entity -> material change -> independent confirmation
          # -> hidden connection -> company mapping. Old context can inform a sector, but
          # stale articles cannot create a fresh landed signal or a 7-10D watch by themselves.
          sectors={
            'Defence & Aerospace': {
              'terms':['defence','defense','military','missile','navy','air force','drdo','shipbuilding','fighter jet','fighter aircraft','aerospace','helicopter','drone','uav'],
              'strong':['missile','shipbuilding','drdo','fighter jet','fighter aircraft','defence order','military procurement','aircraft order'],
              'companies':['hindustan aeronautics','hal','bharat dynamics','bdl','mazagon dock','cochin shipyard','garden reach','grse','bharat electronics','bel']},
            'Electronics & Semiconductors': {
              'terms':['semiconductor','semiconductors','chip','chips','fab','foundry','ems','electronics manufacturing','assembly testing','display','wafer','packaging','silicon','chip design'],
              'strong':['semiconductor','fab','foundry','wafer','assembly testing','chip design','electronics manufacturing'],
              'companies':['tata electronics','tata semiconductor','kaynes technology','dixon technologies','cg power','polymatech','moschip','syrma sgs']},
            'Power & Grid': {
              'terms':['power grid','electricity grid','transmission','substation','transformer','power plant','renewable power','solar power','wind power','battery storage','energy storage','data centre power','data center power','grid capacity'],
              'strong':['transmission','substation','transformer','power plant','grid capacity','data centre power','data center power','energy storage'],
              'companies':['power grid corporation','powergrid','ntpc','nhpc','tata power','jsw energy','adani green','siemens energy','hitachi energy','abb india']},
            'Rail & Infrastructure': {
              'terms':['railway','railways','rail project','metro rail','freight corridor','highway project','expressway','road project','port project','airport project','epc project','infrastructure project','rail tender','rail order'],
              'strong':['rail project','metro rail','freight corridor','highway project','expressway','rail tender','rail order','infrastructure project'],
              'companies':['rvnl','ircon','rail vikas nigam','titagarh rail','texmaco rail','bhel','larsen','larsen & toubro','nbcc','ashoka buildcon']},
            'Banking & Financials': {
              'terms':['rbi','reserve bank','banking','bank loan','credit growth','deposit growth','nbfc','liquidity','forex swap','fc nr','insurance','financial inclusion','capital adequacy','bank merger'],
              'strong':['rbi','reserve bank','credit growth','deposit growth','nbfc','liquidity','forex swap','fc nr','bank merger'],
              'companies':['hdfc bank','icici bank','sbi','state bank of india','axis bank','kotak mahindra bank','bank of baroda','canara bank','bajaj finance']},
            'Auto & Components': {
              'terms':['automobile','automotive','passenger vehicle','commercial vehicle','two wheeler','three wheeler','tractor','auto component','auto components','tyre','tire','electric vehicle','ev sales','vehicle production','vehicle exports'],
              'strong':['passenger vehicle','commercial vehicle','two wheeler','tractor','auto component','vehicle production','vehicle exports','ev sales'],
              'companies':['maruti suzuki','tata motors','mahindra','bajaj auto','hero motocorp','eicher motors','ashok leyland','motherson','bharat forge','bosch india']},
            'Pharma & Healthcare': {
              'terms':['pharmaceutical','pharma','drug approval','drug regulator','medicine','api manufacturing','active pharmaceutical ingredient','medical device','hospital chain','healthcare','biotech','vaccine','usfda','fda approval'],
              'strong':['drug approval','drug regulator','api manufacturing','active pharmaceutical ingredient','medical device','usfda','fda approval'],
              'companies':['sun pharma','dr reddy','cipla','divis laboratories','aurobindo pharma','lupin','zydus lifesciences','torrent pharma','apollo hospitals']},
            'Chemicals & Materials': {
              'terms':['specialty chemical','chemical plant','fertilizer','urea','ammonia','petrochemical','polymer','cement capacity','steel capacity','aluminium smelter','aluminum smelter','industrial material','chemical exports','chemical imports'],
              'strong':['specialty chemical','chemical plant','fertilizer','urea','ammonia','petrochemical','polymer','cement capacity','steel capacity','chemical exports','chemical imports'],
              'companies':['pidilite','aarti industries','sr f','deepak nitrite','upl','coromandel international','gnfc','tatva chintan','ultratech cement']},
            'Sugar & Ethanol': {
              'terms':['sugar','sugarcane','sugar cane','molasses','ethanol','distillery','sugar mill','ethanol blending','raw sugar','sugar quota','sugar import','sugar export','sugar stock','cane price','fair remunerative price'],
              'strong':['ethanol','sugar quota','sugar import','sugar export','sugar stock','cane price','fair remunerative price','sugarcane','molasses'],
              'companies':['balrampur chini','triveni engineering','dalmia bharat sugar','shree renuka sugars','e i d parry','dwarikesh sugar','bajaj hindusthan sugar','uttam sugar']}
          }

          triggers={
            'POLICY':['policy','regulation','rule','notification','approval','scheme','subsidy','quota','government','ministry','rbi','tariff','duty','restriction','stock limit','stock-limit','mandate','ban','prohibited'],
            'CAPEX':['capex','investment','expansion','capacity','plant','factory','manufacturing','project','commissioning'],
            'ORDERS':['order','orders','contract','tender','procurement','award','purchase','delivery','agreement'],
            'TRADE':['import','imports','export','exports','tariff','quota','shipment','trade','supply chain','sourcing','localisation','localization'],
            'PRICING':['price','prices','pricing','cost','margin','commodity','freight','oil','gas','inventory','shortage','surplus','premium','discount'],
            'CORPORATE':['acquisition','partnership','joint venture','guidance','earnings','results','filing','promoter','capacity addition']
          }
          noise=['share price','stock market','sensex','nifty','gift nifty','buy today','sell today','target price','brokerage call','technical analysis','market prediction','price target','stocks to buy','stocks to sell']
          change_terms=['clears','cleared','approves','approved','announces','announced','raises','raised','cuts','cut','reduces','reduced','restricts','restricted','bans','banned','prohibits','prohibited','opens','opened','allows','allowed','eases','eased','tightens','tightened','awards','awarded','orders','invests','investment','expands','expansion','launches','launched','signs','signed','surge','shortage','surplus','record','rises','rising','falls','falling','delay','delayed']

          def clean(s):
            s=s or ''
            s=re.sub(r'<[^>]+>',' ',s)
            return re.sub(r'\s+',' ',s.replace('&amp;','&').replace('&nbsp;',' ')).strip()

          def hits(text, terms):
            return [t for t in terms if t in text]

          def tokens(title):
            stop={'india','indian','new','latest','today','says','say','will','may','could','for','the','and','with','from','after','before','into','over','on','of','to','in','a','an'}
            return set(t for t in re.findall(r'[a-z0-9]+',title.lower()) if t not in stop and len(t)>2)

          def similar(a,b):
            ta,tb=tokens(a),tokens(b)
            return bool(ta and tb) and len(ta&tb)/max(1,len(ta|tb))>=0.48

          queries=[
            ('Business Discovery','India business policy investment order trade supply corporate'),
            ('Macro Discovery','India government policy RBI ministry regulation import export quota tariff'),
            ('Global Transmission','global trade geopolitics commodity energy semiconductor supply chain India impact')
          ]
          for sector,cfg in sectors.items():
            queries.append((sector,' '.join(cfg['strong'][:6])+' India'))

          seen_links=set(); articles=[]
          for feed_name,q in queries:
            try:
              url=BASE+urllib.parse.quote(q)+PARAMS
              root=ET.fromstring(urllib.request.urlopen(urllib.request.Request(url,headers=HEADERS),timeout=30).read())
              for item in root.findall('./channel/item')[:40]:
                title=(item.findtext('title') or '').strip(); link=(item.findtext('link') or '').strip()
                if not title or not link or link in seen_links: continue
                seen_links.add(link)
                pub=(item.findtext('pubDate') or '').strip(); source=(item.findtext('source') or feed_name).strip()
                desc=clean(item.findtext('description'))
                articles.append({'title':title,'link':link,'published':pub,'source':source,'feed':feed_name,'description':desc[:900]})
            except Exception as e:
              print('feed error',feed_name,e)

          now=datetime.now(timezone.utc)
          for a in articles:
            try: dt=parsedate_to_datetime(a['published']).astimezone(timezone.utc)
            except Exception: dt=now
            a['_dt']=dt; a['_age_h']=max(0,(now-dt).total_seconds()/3600)
            a['_text']=(a['title']+' '+a['description']).lower()
            a['_noise']=hits(a['_text'],noise)
            a['_change']=hits(a['_text'],change_terms)

          assignments=[]
          for a in articles:
            best=None
            for sector,cfg in sectors.items():
              sh=hits(a['_text'],cfg['terms']); strong=hits(a['_text'],cfg['strong']); ch=hits(a['_text'],cfg['companies'])
              tg={g:hits(a['_text'],ts) for g,ts in triggers.items()}; active=[g for g,v in tg.items() if v]
              if not sh or not active or not a['_change']: continue
              # Strong sector language is preferred. Generic 'sugar' alone is not enough.
              sector_ok=(len(strong)>=1 and len(active)>=1) or (len(sh)>=2 and len(active)>=1)
              if not sector_ok: continue
              relevance=min(45,len(strong)*11 + min(10,len(sh))*3) + min(18,len(ch)*9)
              change=min(25,len(active)*6 + min(7,len(a['_change']))*2)
              noise_pen=min(24,len(a['_noise'])*8)
              freshness=1.0 if a['_age_h']<=48 else max(0.20,1-(a['_age_h']/240))
              value=(relevance+change-noise_pen)*freshness
              cand={'sector':sector,'sector_hits':sh,'strong_hits':strong,'company_hits':ch,'active':active,'value':value}
              if best is None or value>best['value']: best=cand
            if best:
              a['_assignment']=best; assignments.append(a)

          # Build semantic story clusters within each sector. A cluster is one underlying
          # event/theme; multiple outlets strengthen the source count instead of creating
          # fake independent stories.
          sector_clusters={s:[] for s in sectors}
          for a in sorted(assignments,key=lambda x:x['_assignment']['value'],reverse=True):
            s=a['_assignment']['sector']; placed=False
            for c in sector_clusters[s]:
              if similar(a['title'],c[0]['title']):
                c.append(a); placed=True; break
            if not placed: sector_clusters[s].append([a])

          def source_key(s):
            s=s.lower().strip()
            return re.sub(r'[^a-z0-9]','',s)

          def connection(active,sector):
            out=[]
            if 'POLICY' in active and 'TRADE' in active: out.append('Policy + trade can change domestic supply, import/export flows and realisations.')
            if 'POLICY' in active and 'PRICING' in active: out.append('Policy + pricing can change inventory economics, margins or the supply-demand balance.')
            if 'CAPEX' in active and 'ORDERS' in active: out.append('Capacity spending + orders can indicate a demand/capacity cycle rather than headline noise.')
            if 'TRADE' in active and 'PRICING' in active: out.append('Trade flow + pricing pressure can expose a supply squeeze or easing cycle.')
            if 'CORPORATE' in active and ('CAPEX' in active or 'ORDERS' in active): out.append('Corporate action reinforced by capex/orders is a stronger operating signal.')
            if not out: out.append('Repeated sector-specific change evidence warrants company-level verification.')
            return out[:3]

          opportunities=[]
          for sector in sectors:
            clusters=sector_clusters[sector]
            if not clusters:
              opportunities.append({'industry':sector,'score':0,'article_count':0,'trigger_count':0,'triggers':[],'evidence':[],'confidence':'low','watch':'MONITOR','reason':'No sufficiently relevant sector-changing evidence in the monitored feeds.','source_count':0,'story_clusters':0,'companies':[],'connections':[],'fresh_count':0})
              continue
            sources=set(); active=set(); companies=set(); fresh_count=0; trigger_total=0; positive=0; negative=0; evidence=[]
            for c in clusters[:12]:
              for a in c:
                sources.add(source_key(a['source'])); active.update(a['_assignment']['active']); trigger_total += len(a['_assignment']['active'])
                if a['_age_h']<=96: fresh_count+=1
                companies.update(a['_assignment']['company_hits'])
              lead=max(c,key=lambda x:x['_assignment']['value'])
              evidence.append({'title':lead['title'],'source':lead['source'],'link':lead['link'],'triggers':lead['_assignment']['active'],'companies':lead['_assignment']['company_hits']})
              positive += sum(1 for x in ['higher','growth','increase','raises','shortage','tight supply','expansion','approved','award','surge'] if x in lead['_text'])
              negative += sum(1 for x in ['lower','decline','reduce','restriction','ban','delay','cancel','oversupply','weak demand','shutdown'] if x in lead['_text'])
            independent=len(sources); cluster_count=min(12,len(clusters)); signal_types=len(active)
            contradiction=positive>0 and negative>0 and abs(positive-negative)<=2
            # A stale cluster can provide context, but freshness is required for promotion.
            score=min(99,round(min(30,independent*6)+min(24,cluster_count*5)+min(22,signal_types*6+min(10,trigger_total))+min(14,fresh_count*2)+min(10,len(companies)*2)))
            if contradiction: score=max(0,score-10)
            has_fresh_catalyst=any(max(x,key=lambda z:z['_assignment']['value'])['_age_h']<=96 for x in clusters[:12])
            watch='MONITOR'
            if score>=70 and independent>=3 and cluster_count>=2 and signal_types>=2 and fresh_count>=2 and has_fresh_catalyst and not contradiction:
              watch='7–10D WATCH'
            elif score>=48 and independent>=2 and signal_types>=1 and has_fresh_catalyst:
              watch='WATCH'
            confidence='high' if independent>=4 and cluster_count>=2 and signal_types>=2 else ('medium' if independent>=2 else 'low')
            reasons=[]
            if signal_types: reasons.append('Cross-signal '+', '.join(sorted(active)[:4]))
            reasons.append(str(cluster_count)+' distinct story clusters')
            if independent>=2: reasons.append(str(independent)+' independent sources')
            if fresh_count: reasons.append(str(fresh_count)+' fresh evidence items')
            if contradiction: reasons.append('mixed positive/negative evidence')
            opportunities.append({'industry':sector,'score':score,'article_count':len(assignments) if False else sum(len(c) for c in clusters),'trigger_count':trigger_total,'triggers':sorted(active),'evidence':evidence[:5],'confidence':confidence,'watch':watch,'reason':'; '.join(reasons)+'.','source_count':independent,'story_clusters':cluster_count,'companies':sorted(companies)[:8],'connections':connection(active,sector),'fresh_count':fresh_count})

          opportunities.sort(key=lambda x:(x['score'],x['fresh_count'],x['source_count']),reverse=True)

          # Top 20 is intentionally limited to the last 7 days. This prevents old Google
          # News search results from pretending to be emerging signals.
          candidates=[]
          for a in assignments:
            if a['_age_h']>168: continue
            if a['_noise'] and not a['_assignment']['strong_hits']: continue
            if not a['_assignment']['active'] or not a['_change']: continue
            candidates.append(a)
          candidates.sort(key=lambda a:a['_assignment']['value'],reverse=True)
          top=[]; seen=[]
          for a in candidates:
            if any(similar(a['title'],b['title']) for b in seen): continue
            x={k:v for k,v in a.items() if not k.startswith('_')}
            x['sector']=a['_assignment']['sector']; x['triggers']=a['_assignment']['active']; x['signal_score']=round(a['_assignment']['value'],1)
            top.append(x); seen.append(a)
            if len(top)>=20: break

          # Landed Today is a separate freshness gate: only items <=36h old qualify.
          landed=[]
          for a in sorted(assignments,key=lambda x:x['_assignment']['value'],reverse=True):
            if a['_age_h']>36: continue
            if a['_noise'] and not a['_assignment']['strong_hits']: continue
            if not a['_assignment']['active'] or not a['_change']: continue
            landed.append({
              'title':a['title'],'link':a['link'],'published':a['published'],'source':a['source'],
              'sector':a['_assignment']['sector'],'triggers':a['_assignment']['active'],
              'label':'MACRO' if a['feed'].lower().startswith('macro') else ('GLOBAL' if a['feed'].lower().startswith('global') else 'GIGA+'),
              'why':'Fresh sector-specific change signal with an identifiable trigger; promoted for investigation, not because of a predicted price move.',
              'impact':'Hidden connection: '+connection(a['_assignment']['active'],a['_assignment']['sector'])[0],
              'freshness_hours':round(a['_age_h'],1)
            })
            if len(landed)>=6: break

          payload={
            'updated_utc':now.isoformat(),
            'source':'Google News RSS · Business + Macro + Global + sector-focused discovery',
            'engine':'ADXmug Signal Engine v5 — freshness gate + entity relevance + semantic story clusters + hidden connections + source diversity + 7–10D research watch',
            'method':'Freshness → entity → sector → material change → story cluster → independent confirmation → hidden connection → company mapping → research watch',
            'articles':top,
            'landed':landed,
            'opportunities':opportunities[:9]
          }
          Path('adxmug').mkdir(exist_ok=True)
          Path('adxmug/news.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print('v5 top signals:',len(top),'landed:',len(landed))
          for x in opportunities[:9]: print(x['industry'],x['score'],x['source_count'],x['story_clusters'],x['watch'],x['fresh_count'])

      - name: Commit intelligence data
        run: |
          git config user.name 'ADXmug Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adxmug/news.json
          git diff --cached --quiet || git commit -m 'Update ADXmug v5 intelligence feed'
          git push
