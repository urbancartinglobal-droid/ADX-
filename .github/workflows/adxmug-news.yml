name: ADXmug Intelligence Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build multi-source intelligence feed
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          HEADERS={'User-Agent':'ADXmug/2.0'}
          feeds=[
            ('Google News Business','https://news.google.com/rss/headlines/section/topic/BUSINESS?hl=en-IN&gl=IN&ceid=IN:en'),
            ('Corporate Intelligence','https://news.google.com/rss/search?q='+urllib.parse.quote('India corporate order capex expansion acquisition partnership results')+'&hl=en-IN&gl=IN&ceid=IN:en'),
            ('Macro Intelligence','https://news.google.com/rss/search?q='+urllib.parse.quote('India government policy RBI budget regulation import export subsidy tender')+'&hl=en-IN&gl=IN&ceid=IN:en'),
            ('Global Intelligence','https://news.google.com/rss/search?q='+urllib.parse.quote('global trade geopolitics commodities semiconductor energy India impact')+'&hl=en-IN&gl=IN&ceid=IN:en')
          ]

          industries={
            'Defence & Aerospace':['defence','defense','military','missile','navy','aircraft','drdo','shipbuilding','fighter','procurement','aerospace'],
            'Electronics & Semiconductors':['semiconductor','chip','electronics','ems','display','fab','assembly','testing','silicon','data center','electronics manufacturing'],
            'Power & Grid':['power','grid','transmission','electricity','transformer','renewable','solar','storage','battery','wind','energy'],
            'Rail & Infrastructure':['rail','metro','highway','infrastructure','capex','construction','epc','tender','road','port','airport'],
            'Banking & Financials':['rbi','bank','credit','loan','deposit','insurance','finance','liquidity','nbfc'],
            'Auto & Components':['auto','automobile','ev','vehicle','battery','component','mobility','two-wheeler'],
            'Pharma & Healthcare':['pharma','drug','medicine','hospital','healthcare','api','biotech','medical'],
            'Chemicals & Materials':['chemical','specialty chemical','cement','steel','aluminium','commodity','material','fertilizer'],
            'Sugar & Ethanol':['sugar','ethanol','molasses','distillery','cane','biofuel']
          }
          trigger_groups={
            'POLICY':['policy','regulation','approval','scheme','subsidy','quota','government','ministry','rbi','tariff'],
            'CAPEX':['capex','investment','expansion','capacity','plant','factory','manufacturing'],
            'ORDERS':['order','orders','contract','tender','procurement','award'],
            'TRADE':['import','export','tariff','quota','shipment','trade'],
            'PRICING':['price','prices','shortage','surplus','production','inventory'],
            'CORPORATE':['acquisition','partnership','localisation','localization','joint venture','guidance','earnings']
          }

          def clean(s):
            return re.sub(r'<[^>]+>',' ',s or '').replace('&amp;','&').strip()

          seen=set(); articles=[]
          for feed_name,url in feeds:
            try:
              req=urllib.request.Request(url,headers=HEADERS)
              root=ET.fromstring(urllib.request.urlopen(req,timeout=30).read())
              for item in root.findall('./channel/item')[:30]:
                title=(item.findtext('title') or '').strip()
                link=(item.findtext('link') or '').strip()
                pub=(item.findtext('pubDate') or '').strip()
                source=(item.findtext('source') or feed_name).strip()
                desc=clean(item.findtext('description'))
                key=(title.lower(),source.lower())
                if not title or key in seen: continue
                seen.add(key)
                text=(title+' '+desc).lower()
                triggers=[g for g,words in trigger_groups.items() if any(w in text for w in words)]
                articles.append({'title':title,'link':link,'published':pub,'source':source,'feed':feed_name,'description':desc[:400],'triggers':triggers})
            except Exception as e:
              print('feed error',feed_name,e)

          articles=articles[:80]
          rows=[]
          for name,keys in industries.items():
            hits=[]; trigger_set=set(); sources=set(); score=0
            for a in articles:
              text=(a['title']+' '+a['description']).lower()
              k=sum(1 for x in keys if x in text)
              tg=a.get('triggers',[])
              if k:
                hits.append(a['title']); sources.add(a['source'])
                trigger_set.update(tg)
                score += min(18,k*7) + min(12,len(tg)*2)
            score += min(15,max(0,len(sources)-1)*5)
            score=min(99,score)
            confidence='high' if score>=60 and len(sources)>=2 else ('medium' if score>=30 else 'low')
            watch='7–10D WATCH' if score>=30 else 'MONITOR'
            reason='Cross-source '+', '.join(sorted(trigger_set)[:3])+' signals with '+str(len(sources))+' source(s).' if trigger_set else 'Monitor for repeated sector mentions and leading triggers.'
            rows.append({'industry':name,'score':score,'article_count':len(hits),'trigger_count':len(trigger_set),'triggers':sorted(trigger_set),'evidence':hits[:5],'confidence':confidence,'watch':watch,'reason':reason,'source_count':len(sources)})
          rows.sort(key=lambda x:(x['score'],x['source_count']),reverse=True)

          payload={'updated_utc':datetime.now(timezone.utc).isoformat(),'source':'Google News multi-feed · Business + Corporate + Macro + Global','method':'Evidence clustering heuristic; not a price prediction','articles':articles[:20],'opportunities':rows[:9]}
          Path('adxmug').mkdir(exist_ok=True)
          Path('adxmug/news.json').write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
          print('articles:',len(articles),'opportunities:',len(rows))

      - name: Commit intelligence data
        run: |
          git config user.name 'ADXmug Intelligence Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add adxmug/news.json
          git diff --cached --quiet || git commit -m 'Update ADXmug intelligence feed'
          git push
