name: Build ADX Advanced APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    paths:
      - "android_advanced/**"
      - ".github/workflows/build-adx-advanced-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android_advanced
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        working-directory: android_advanced
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADX-AI-Assistant-Advanced-debug
          path: android_advanced/app/build/outputs/apk/debug/app-debug.apk
